<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | E-tecidos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="pagina-cadastro">
    <header class="cabeca cabeca-menor">
        <div class="dv-header">
            <div class="dv-titulo">
                <a class="tituloProjeto" href="index.html">E-tecidos</a>
            </div>
            <nav class="dv-ul" aria-label="Navegação principal">
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="#cadastro">Cadastro</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="conteudo-cadastro">
        <section class="cartao-cadastro" id="cadastro" aria-labelledby="titulo-cadastro">
            <div class="introducao-cadastro">
                <p class="etiqueta">Junte-se à E-tecidos</p>
                <h1 id="titulo-cadastro">Crie seu cadastro</h1>
                <p>Preencha os dados abaixo para começar.</p>
            </div>

            <form class="formulario-cadastro" action="#" method="post">
                <fieldset>
                    <legend>Tipo de cadastro</legend>
                    <div class="opcoes-tipo">
                        <label class="opcao-tipo">
                            <input type="radio" name="tipo_pessoa" value="fisica" checked>
                            Pessoa física
                        </label>
                        <label class="opcao-tipo">
                            <input type="radio" name="tipo_pessoa" value="juridica">
                            Pessoa jurídica (CNPJ)
                        </label>
                    </div>
                </fieldset>

                <fieldset id="dados-pessoa-fisica">
                    <legend>Dados pessoais</legend>
                    <div class="grade-formulario">
                        <div class="campo">
                            <label for="nome">Nome completo</label>
                            <input id="nome" name="nome" type="text" autocomplete="name" required>
                        </div>
                        <div class="campo">
                            <label for="cpf">CPF</label>
                            <input id="cpf" name="cpf" type="text" inputmode="numeric"
                                placeholder="000.000.000-00" pattern="[0-9.\-]{11,14}" required>
                        </div>
                        <div class="campo">
                            <label for="data-nascimento">Data de nascimento</label>
                            <input id="data-nascimento" name="data_nascimento" type="date" required>
                        </div>
                        <div class="campo campo-largo">
                            <label for="endereco-pf">Endereço</label>
                            <input id="endereco-pf" name="endereco" type="text"
                                autocomplete="street-address" required>
                        </div>
                    </div>
                </fieldset>

                <fieldset id="dados-pessoa-juridica" hidden>
                    <legend>Dados da empresa</legend>
                    <div class="grade-formulario">
                        <div class="campo campo-largo">
                            <label for="razao-social">Nome da empresa</label>
                            <input id="razao-social" name="razao_social" type="text"
                                autocomplete="organization" disabled>
                        </div>
                        <div class="campo">
                            <label for="cnpj">CNPJ</label>
                            <input id="cnpj" name="cnpj" type="text" inputmode="numeric"
                                placeholder="00.000.000/0000-00" pattern="[0-9./\-]{14,18}" disabled>
                        </div>
                        <div class="campo">
                            <label for="localizacao">Localização</label>
                            <input id="localizacao" name="localizacao" type="text"
                                autocomplete="street-address" disabled>
                        </div>
                        <div class="campo campo-largo">
                            <label for="descricao">Descrição do que a empresa faz</label>
                            <textarea id="descricao" name="descricao" rows="4" disabled></textarea>
                        </div>
                        <div class="campo">
                            <label for="senha">Senha para login</label>
                            <input id="senha" name="senha" type="password" minlength="8"
                                autocomplete="new-password" disabled>
                            <small>Mínimo de 8 caracteres.</small>
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Contato e pagamento</legend>
                    <div class="grade-formulario">
                        <div class="campo campo-largo">
                            <label for="email">E-mail</label>
                            <input id="email" name="email" type="email" autocomplete="email" required>
                        </div>
                        <div class="campo campo-largo">
                            <label for="nome-cartao">Nome no cartão</label>
                            <input id="nome-cartao" name="nome_cartao" type="text"
                                autocomplete="cc-name" required>
                        </div>
                        <div class="campo campo-largo">
                            <label for="numero-cartao">Número do cartão</label>
                            <input id="numero-cartao" name="numero_cartao" type="text"
                                inputmode="numeric" autocomplete="cc-number" required>
                        </div>
                        <div class="campo">
                            <label for="validade">Validade</label>
                            <input id="validade" name="validade" type="month"
                                autocomplete="cc-exp" required>
                        </div>
                        <div class="campo">
                            <label for="codigo-seguranca">Código de segurança</label>
                            <input id="codigo-seguranca" name="codigo_seguranca" type="password"
                                inputmode="numeric" maxlength="4" autocomplete="cc-csc" required>
                        </div>
                    </div>
                </fieldset>

                <label class="aceite">
                    <input type="checkbox" name="aceite" required>
                    <span>Concordo com os termos de uso e a política de privacidade.</span>
                </label>
                <button type="submit">Criar cadastro</button>
            </form>
        </section>
    </main>

    <script>
        const opcoesTipo = document.querySelectorAll('input[name="tipo_pessoa"]');
        const dadosFisica = document.querySelector("#dados-pessoa-fisica");
        const dadosJuridica = document.querySelector("#dados-pessoa-juridica");

        function atualizarTipoPessoa(event) {
            const pessoaJuridica = event.target.value === "juridica";
            dadosFisica.hidden = pessoaJuridica;
            dadosJuridica.hidden = !pessoaJuridica;

            dadosFisica.querySelectorAll("input").forEach((campo) => {
                campo.disabled = pessoaJuridica;
                campo.required = !pessoaJuridica;
            });
            dadosJuridica.querySelectorAll("input, textarea").forEach((campo) => {
                campo.disabled = !pessoaJuridica;
                campo.required = pessoaJuridica;
            });
        }

        opcoesTipo.forEach((opcao) => opcao.addEventListener("change", atualizarTipoPessoa));
    </script>
</body>

</html>
